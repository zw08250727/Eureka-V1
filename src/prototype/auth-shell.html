<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EurekaMind · 个人 AI 工作台</title>
  <style>
    :root{--ink:#202226;--muted:#73787d;--line:#e4e7ea;--blue:#165dff;--canvas:#f4f7f8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"MiSans","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--canvas)}button,input{font:inherit}button{cursor:pointer}.auth{min-height:100vh;display:grid;grid-template-columns:minmax(460px,.92fr) minmax(540px,1.08fr);background:#fff}.auth-form{display:grid;place-items:center;padding:34px 52px}.form{width:min(405px,100%)}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;width:36px;height:36px;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#1a62ff,#27b6c9);font-size:18px;font-weight:900;box-shadow:0 8px 18px #165dff29}.brand strong{font-size:16px;line-height:18px}.brand small{display:block;margin-top:2px;color:#72777d;font-size:11px;line-height:14px}.form>.brand{margin-bottom:56px}.form h1{margin:0;color:#1d2329;font-size:32px;letter-spacing:-.05em}.desc{margin:8px 0 24px;color:#737b84;font-size:13px;line-height:20px}.oauth{display:grid;gap:10px}.oauth button{display:flex;width:100%;height:48px;align-items:center;justify-content:center;gap:11px;border:1px solid #e1e5e9;border-radius:10px;color:#293038;background:#f7f8f9;font-size:14px;font-weight:700;transition:.16s}.oauth button:hover{border-color:#b9c6d3;background:#f1f5f8;transform:translateY(-1px)}.oauth-mark{display:inline-grid;width:20px;height:20px;place-items:center;font-size:18px}.oauth-mark.google{color:#4285f4}.oauth-mark.apple{color:#171717}.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#a0a7ad;font-size:12px}.divider:before,.divider:after{height:1px;flex:1;background:#e6e9ec;content:""}.label{display:block;margin:13px 0 7px;color:#626972;font-size:12px;font-weight:750}.input{width:100%;height:48px;padding:0 14px;border:1px solid #d2d5d8;border-radius:8px;outline:none;background:#fff}.input:focus{border-color:#1f2328;box-shadow:0 0 0 3px #1f23280d}.code-row{display:flex;gap:8px}.code-row .input{flex:1}.plain{height:48px;padding:0 14px;border:1px solid #d7dce1;border-radius:8px;color:#454b52;background:#fff;font-size:12px;font-weight:700}.plain:hover{background:#f7f8fa}.primary{width:100%;height:48px;margin-top:20px;border:1px solid #171717;border-radius:8px;color:#fff;background:#171717;font-weight:800}.primary:hover{background:#303030}.check{display:flex;gap:8px;align-items:flex-start;margin-top:15px;color:#666d75;font-size:12px;line-height:1.5}.check input{width:15px;height:15px;margin-top:1px;accent-color:#171717}.check a{color:#2a6f89;font-weight:800;text-decoration:none}.switch{text-align:center;margin-top:18px;color:var(--muted);font-size:12px}.switch button{padding:0;border:0;color:var(--blue);background:transparent;font-weight:800}.status{min-height:18px;margin-top:10px;color:#237356;font-size:11px;text-align:center}.auth-visual{position:relative;display:grid;min-height:100vh;place-items:center;overflow:hidden;border-left:1px solid #dce5e8;background:linear-gradient(145deg,#f3f8fa,#edf4f6)}.auth-visual:before{position:absolute;top:-170px;right:-90px;width:580px;height:580px;border-radius:50%;background:#d9eff6;content:""}.auth-visual:after{position:absolute;bottom:-260px;left:-120px;width:560px;height:560px;border-radius:50%;background:#e2ecff;content:""}.visual-inner{position:relative;z-index:1;width:min(570px,78%);text-align:center}.visual-kicker{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #c9e9f1;border-radius:999px;color:#216d82;background:#f4fdff;font-size:11px;font-weight:750}.visual-kicker i{width:7px;height:7px;border-radius:50%;background:#2aa9c7}.visual-inner h2{margin:24px 0 12px;color:#1e2c36;font-size:42px;letter-spacing:-.06em;line-height:1.08}.visual-inner p{max-width:450px;margin:0 auto;color:#677a84;font-size:14px;line-height:1.8}.workspace-preview{position:relative;width:100%;height:255px;margin:38px auto 0;padding:18px;border:1px solid #dce8ed;border-radius:18px;background:#fff;box-shadow:0 22px 48px #4d778f1f;text-align:left;transform:rotate(-2deg)}.preview-top{display:flex;align-items:center;gap:7px;color:#273a44;font-size:11px;font-weight:750}.preview-dot{width:7px;height:7px;border-radius:50%;background:#2aa9c7}.preview-grid{display:grid;gap:10px;margin-top:16px;grid-template-columns:100px 1fr}.preview-side{display:grid;gap:6px}.preview-nav{height:26px;padding:0 9px;border-radius:6px;color:#7a8b94;font-size:9px;line-height:26px}.preview-nav.active{color:#1d5ef2;background:#eef4ff;font-weight:700}.preview-main{display:grid;gap:10px;grid-template-columns:1fr 1fr}.preview-card{min-height:88px;padding:12px;border:1px solid #edf1f3;border-radius:10px;background:#fbfcfd}.preview-card strong,.preview-card span{display:block}.preview-card strong{color:#273b46;font-size:11px}.preview-card span{margin-top:8px;color:#8a9aa2;font-size:9px;line-height:15px}.visual-footer{position:absolute;right:0;bottom:42px;left:0;z-index:1;color:#84939a;font-size:11px;text-align:center}.auth-demo{margin:10px 0 0;color:#8b959e;font-size:11px;line-height:1.6}.primary:disabled,.oauth button:disabled{cursor:wait;opacity:.7}@media(max-width:960px){.auth{grid-template-columns:1fr}.auth-visual{display:none}}@media(max-width:520px){.auth-form{padding:25px 20px}.form>.brand{margin-bottom:35px}.form h1{font-size:28px}}
  </style>
  <link rel="stylesheet" href="assets/auth-aqua-clear.css?v=direct-home-v1" />
  <link rel="prefetch" href="one-to-one-reference/team-only-app.html?edition=personal&amp;personal=1" />
</head>
<body><main id="root"></main>
<script>
const state={mode:'login',entering:false};const root=document.getElementById('root');
const brand='<div class="brand"><span class="mark">e·</span><div><strong>EurekaMind</strong><small>Personal workspace</small></div></div>';
function render(){root.innerHTML=auth();bind()}
function auth(){const login=state.mode==='login';return `<main class="auth"><section class="auth-form"><form class="form" id="auth-form" novalidate>${brand}<h1>${login?'欢迎回来':'创建你的账号'}</h1><p class="desc">${login?'使用你的 EurekaMind 账号进入个人工作台。':'注册后即可进入个人工作台。'}</p><div class="oauth"><button type="button" id="google"><span class="oauth-mark google">G</span>${login?'使用 Google 登录':'使用 Google 注册'}</button><button type="button" id="apple"><span class="oauth-mark apple">●</span>${login?'使用 Apple 登录':'使用 Apple 注册'}</button></div><div class="divider"><span>或使用邮箱</span></div><label class="label" for="email">邮箱地址</label><input id="email" type="email" autocomplete="email" class="input" placeholder="name@company.com" value="demo@eurekamind.com"/><label class="label" for="code">验证码</label><div class="code-row"><input id="code" inputmode="numeric" autocomplete="one-time-code" class="input" placeholder="请输入 6 位验证码" value="123456"/><button type="button" class="plain" id="send">获取验证码</button></div><label class="check"><input id="terms" type="checkbox" checked/> <span>我已阅读并同意 <a href="#" data-policy="terms">服务条款</a> 与 <a href="#" data-policy="privacy">隐私政策</a>。</span></label><label class="check"><input id="updates" type="checkbox" checked/> <span>接收 EurekaMind 产品更新与服务通知。</span></label><button type="submit" class="primary" id="submit">${login?'登录并进入首页':'注册并进入首页'}</button><p class="auth-demo">交互演示：邮箱与第三方登录均使用模拟账号。</p><div class="status" id="status" role="status" aria-live="polite"></div><div class="switch">${login?'还没有账号？':'已有账号？'} <button type="button" id="toggle">${login?'立即注册':'返回登录'}</button></div></form></section><section class="auth-visual"><div class="visual-inner"><span class="visual-kicker"><i></i> EurekaMind Personal workspace</span><h2>把每一次交流，<br/>变成个人知识资产。</h2><p>记录会议、沉淀闪念、协作跟进，在同一个空间里把想法推进到下一步。</p><div class="workspace-preview"><div class="preview-top"><span class="preview-dot"></span>个人 AI 工作台</div><div class="preview-grid"><div class="preview-side"><div class="preview-nav active">首页</div><div class="preview-nav">开始录音</div><div class="preview-nav">联系人</div></div><div class="preview-main"><div class="preview-card"><strong>我的会议</strong><span>管理录音、转写、纪要和待办</span></div><div class="preview-card"><strong>Ask Agent</strong><span>围绕当前页面继续工作</span></div></div></div></div></div><div class="visual-footer">登录后进入个人工作台 · 记录会议与整理知识</div></section></main>`}
function setStatus(message){const node=document.getElementById('status');if(node){node.textContent=message;window.setTimeout(()=>{if(node.textContent===message)node.textContent=''},2600)}}
const workspaceUrl=new URL('one-to-one-reference/team-only-app.html?edition=personal&personal=1',location.href);
function enterWorkspace(){
  if(state.entering)return;
  state.entering=true;
  document.getElementById('auth-form').setAttribute('aria-busy','true');
  document.querySelectorAll('#auth-form button').forEach(button=>button.disabled=true);
  document.getElementById('submit').textContent='正在进入首页…';
  // Replace the current document instead of rendering an empty nested iframe.
  // The browser keeps the sign-in page visible until the home document is ready.
  location.replace(workspaceUrl.href);
}
function termsAccepted(){
  if(document.getElementById('terms').checked)return true;
  setStatus('请先同意服务条款与隐私政策');
  document.getElementById('terms').focus();
  return false;
}
function validEmail(){
  const email=document.getElementById('email');
  if(email.value.trim() && email.validity.valid)return true;
  setStatus('请输入有效的邮箱地址');email.focus();return false;
}
function bind(){
  document.getElementById('auth-form').onsubmit=event=>{
    event.preventDefault();
    if(state.entering || !termsAccepted() || !validEmail())return;
    const code=document.getElementById('code');
    if(!code.value.trim()){setStatus('请输入邮箱验证码');code.focus();return}
    enterWorkspace();
  };
  document.getElementById('toggle').onclick=()=>{state.mode=state.mode==='login'?'register':'login';render()};
  const send=document.getElementById('send');
  send.onclick=()=>{
    if(!validEmail())return;
    send.textContent='已发送';send.disabled=true;
    setStatus('演示验证码：123456');
  };
  // These are prototype paths, not production OAuth or authentication bypasses.
  ['google','apple'].forEach(id=>{
    document.getElementById(id).onclick=()=>{if(termsAccepted())enterWorkspace()};
  });
  document.querySelectorAll('[data-policy]').forEach(link=>link.onclick=event=>{
    event.preventDefault();setStatus(link.dataset.policy==='terms'?'服务条款预览':'隐私政策预览');
  });
}

render();
</script></body></html>
