<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>会议内容编辑 · EurekaMind</title><link rel="icon" href="assets/eurekamind-logo.png"><link rel="stylesheet" href="assets/meeting-detail.css?v=1"><style>
body{margin:0;background:#f7f8fb;color:#303641;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #5c79ff;outline-offset:3px}.editor-shell{height:100dvh;display:flex;flex-direction:column}.editor-top{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #e8eaf0;background:white}.editor-top strong{font-size:16px}.editor-top p{margin:4px 0 0;font-size:12px;color:#8d95a4}.editor-top .md-btn{padding:8px 22px;border:1px solid #e1e5ef;border-radius:6px;background:white}.editor-top .md-primary{background:#637bff;color:white;border-color:#637bff}.editor-main{flex:1;min-height:0}.editor-main .md-editor-layout{height:100%}.md-editor-doc{padding:20px 40px}.md-editor-toolbar select{border:0;background:white;padding:5px;color:#58667d;border-radius:4px}.md-editor-paper{max-width:950px;width:100%;box-sizing:border-box;align-self:center}.md-editor-paper input{width:100%;background:transparent;outline:none;color:#283147}.md-editor-assistant{background:white}.md-editor-assistant textarea{box-sizing:border-box;width:100%;padding:12px;min-height:90px;border:1px solid #e4e8f0;border-radius:8px;resize:vertical}.md-editor-assistant button{border:1px solid #dbe1f1;background:#f1f4ff;color:#5067bb;padding:8px 12px;border-radius:6px}.editor-top-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}.editor-status{font-size:12px;color:#739083}.editor-error{padding:60px;text-align:center}.md-editor-toolbar button[aria-pressed=true]{background:#e9efff}.md-editor-paper [contenteditable] ul{padding-left:24px}@media(max-width:800px){.editor-top p{display:none}.editor-top{padding:12px}.md-editor-doc{padding:12px}.md-editor-paper{padding:24px}}
</style></head><body><div class="editor-shell" id="editor-shell"><header class="editor-top"><div><strong id="editor-heading">会议内容编辑</strong><p>💡 选中任意文字，即可使用 Ask AI 或文本编辑功能 · 按 Ctrl/Cmd+Z 快速撤销</p></div><div class="editor-top-actions"><span class="editor-status" id="editor-status" role="status">未修改</span><button id="editor-return" class="md-btn">返回详情</button><button id="editor-save" class="md-btn md-primary" disabled>保存</button></div></header><main class="editor-main" hidden><div class="md-editor-layout"><section class="md-editor-doc"><nav class="md-editor-toolbar" aria-label="正文格式工具"><button data-command="undo" aria-label="撤销">↶</button><button data-command="redo" aria-label="重做">↷</button><select id="editor-block" aria-label="段落样式"><option value="div">正文</option><option value="h2">标题</option><option value="h3">小标题</option></select><select id="editor-font-size" aria-label="字号"><option value="3">默认字号</option><option value="2">小</option><option value="4">中</option><option value="5">大</option><option value="6">特大</option></select><select id="editor-font-family" aria-label="字体"><option value="sans-serif">默认字体</option><option value="serif">宋体</option><option value="monospace">等宽</option></select><button data-command="bold" aria-label="加粗"><b>B</b></button><button data-command="italic" aria-label="斜体"><i>I</i></button><button data-command="underline" aria-label="下划线"><u>U</u></button><button data-command="insertUnorderedList" aria-label="无序列表">• 列表</button><button data-command="insertOrderedList" aria-label="有序列表">1. 列表</button><button data-command="removeFormat">清除格式</button><button id="editor-ask">✧ Ask AI</button></nav><article class="md-editor-paper"><input id="editor-title" aria-label="编辑标题" maxlength="120" placeholder="请输入标题"><small style="display:block;color:#b1b7c3">（可编辑）</small><div id="editor-body" class="md-editable" contenteditable="true" role="textbox" aria-label="编辑正文" aria-multiline="true"></div></article></section><aside class="md-editor-assistant"><h3>百智 AI 写作助手</h3><p class="md-notice">选中文字后点击 Ask AI，继续整理会议内容。<br>当前为本地演示，未连接 AI 服务。</p><div class="md-tag" id="editor-attachment"></div><textarea id="editor-instruction" aria-label="向 AI 提问" placeholder="向 AI 提问"></textarea><button id="editor-generate">整理行动项</button><div id="editor-answer" class="md-prose"></div></aside></div></main></div><script src="assets/meeting-editor.js?v=1"></script></body></html>
