name: Deploy Eureka to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_browser_acceptance:
        description: Skip browser acceptance for an explicitly requested release
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code and models
        run: npm run check
      - name: Build browser acceptance site
        if: ${{ !inputs.skip_browser_acceptance }}
        run: npm run build
      - name: Install browser
        if: ${{ !inputs.skip_browser_acceptance }}
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance
        if: ${{ !inputs.skip_browser_acceptance }}
        run: npm run test:e2e
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Eureka-V1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
