<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EurekaMind 核心业务规则 · 板书</title><style>*{box-sizing:border-box}body{margin:0;background:#ededed;font-family:system-ui}nav{position:sticky;top:0;background:#fff;padding:12px 24px;display:flex;gap:24px;align-items:center;box-shadow:0 1px 8px #0001}nav a{color:#333;text-decoration:none}nav button{margin-left:auto;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}main{max-width:1600px;margin:auto}section{margin:24px 0;scroll-margin-top:70px}svg{display:block;width:100%;height:auto;background:white}@media print{@page{size:A3 landscape;margin:0}nav{display:none}body{background:white}main{max-width:none}section{margin:0;break-after:page;height:100vh;display:flex;align-items:center}svg{max-height:100vh;object-fit:contain}}</style><nav><b>EurekaMind · 板书版</b><a href="#p1">01 内容归属</a><a href="#p2">02 共享权限</a><a href="#p3">03 生命周期</a><button onclick="print()">打印 / 保存 PDF</button></nav><main><section id="p1"><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>先定归属：内容存在哪个工作区？</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#777"/></marker></defs><rect width="1600" height="900" fill="#FAFAFA"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<rect x="52" y="42" width="65" height="34" rx="8" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="84" y="67" font-size="22" font-weight="600" fill="#111111" text-anchor="middle">01</text>
<text x="134" y="68" font-size="21" font-weight="500" fill="#666666" text-anchor="start">EurekaMind · 核心业务规则</text>
<text x="52" y="132" font-size="46" font-weight="650" fill="#111111" text-anchor="start">先定归属：内容存在哪个工作区？</text>
<text x="52" y="171" font-size="23" font-weight="400" fill="#666666" text-anchor="start">一个账号，一个个人工作区，最多一个 Team；两区独立保存内容、权限、订阅与用量。</text>
<rect x="1482" y="50" width="54" height="36" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<circle cx="1497" cy="66" r="3" fill="#D7FF00"/><circle cx="1521" cy="66" r="3" fill="#D7FF00"/>
<path d="M1509 48 L1509 39" fill="none" stroke="#777" stroke-width="2"/>
<text x="52" y="878" font-size="17" font-weight="400" fill="#777777" text-anchor="start">按最终确认规则整理 · 2026.10.10</text>
<text x="1548" y="878" font-size="17" font-weight="400" fill="#777777" text-anchor="end">01 / 03</text>
<rect x="650" y="208" width="300" height="62" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="800" y="248" font-size="28" font-weight="600" fill="#111111" text-anchor="middle">同一个账号</text>
<path d="M800 270 L800 290" fill="none" stroke="#777" stroke-width="2"/>
<path d="M500 290 L1100 290" fill="none" stroke="#777" stroke-width="2"/>
<path d="M500 290 L500 312" fill="none" stroke="#777" stroke-width="2"/>
<polygon points="500,312 494.0,300.0 506.0,300.0" fill="#777"/>
<rect x="280" y="318" width="440" height="68" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="500" y="361" font-size="29" font-weight="600" fill="#111111" text-anchor="middle">个人工作区</text>
<path d="M1100 290 L1100 312" fill="none" stroke="#777" stroke-width="2"/>
<polygon points="1100,312 1094.0,300.0 1106.0,300.0" fill="#777"/>
<rect x="880" y="318" width="440" height="68" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="1100" y="361" font-size="29" font-weight="600" fill="#111111" text-anchor="middle">最多一个 Team</text>
<text x="800" y="416" font-size="21" font-weight="400" fill="#666666" text-anchor="middle">以下三条归属规则适用于每一个工作区</text>
<rect x="52" y="438" width="472" height="270" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="76" y="481" font-size="28" font-weight="600" fill="#111111" text-anchor="start">硬件录音 / 闪念</text>
<text x="76" y="527" font-size="25" font-weight="400" fill="#111111" text-anchor="start">录制时的设备绑定区</text>
<text x="76" y="570" font-size="25" font-weight="400" fill="#111111" text-anchor="start">↓</text>
<text x="76" y="613" font-size="25" font-weight="400" fill="#111111" text-anchor="start">内容进入该区</text>
<text x="76" y="656" font-size="25" font-weight="400" fill="#111111" text-anchor="start">App 切换 ≠ 设备换绑</text>
<rect x="564" y="438" width="472" height="270" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="588" y="481" font-size="28" font-weight="600" fill="#111111" text-anchor="start">软件录音 / 上传 / 创建</text>
<text x="588" y="527" font-size="25" font-weight="400" fill="#111111" text-anchor="start">发起操作时的工作区</text>
<text x="588" y="570" font-size="25" font-weight="400" fill="#111111" text-anchor="start">↓</text>
<text x="588" y="613" font-size="25" font-weight="400" fill="#111111" text-anchor="start">内容进入该区</text>
<text x="588" y="656" font-size="25" font-weight="400" fill="#111111" text-anchor="start">完成时不随视图切换</text>
<rect x="1076" y="438" width="472" height="270" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="1100" y="481" font-size="28" font-weight="600" fill="#111111" text-anchor="start">通讯录</text>
<text x="1100" y="527" font-size="25" font-weight="400" fill="#111111" text-anchor="start">在哪个工作区创建</text>
<text x="1100" y="570" font-size="25" font-weight="400" fill="#111111" text-anchor="start">↓</text>
<text x="1100" y="613" font-size="25" font-weight="400" fill="#111111" text-anchor="start">就在哪个工作区展示</text>
<text x="1100" y="656" font-size="25" font-weight="400" fill="#111111" text-anchor="start">切换不携带、不合并</text>
<rect x="52" y="722" width="1496" height="113" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="78" y="758" font-size="27" font-weight="600" fill="#111111" text-anchor="start">设备换区：本人解绑 → 重新绑定</text>
<text x="78" y="802" font-size="24" font-weight="400" fill="#111111" text-anchor="start">普通换绑只改变后续目标；旧录音仍归原区。移除成员后原绑定失效，旧音频不再补传。</text>
</g></svg></section><section id="p2"><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>再定权限：同区内，谁能看、谁能改？</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#777"/></marker></defs><rect width="1600" height="900" fill="#FAFAFA"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<rect x="52" y="42" width="65" height="34" rx="8" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="84" y="67" font-size="22" font-weight="600" fill="#111111" text-anchor="middle">02</text>
<text x="134" y="68" font-size="21" font-weight="500" fill="#666666" text-anchor="start">EurekaMind · 核心业务规则</text>
<text x="52" y="132" font-size="46" font-weight="650" fill="#111111" text-anchor="start">再定权限：同区内，谁能看、谁能改？</text>
<text x="52" y="171" font-size="23" font-weight="400" fill="#666666" text-anchor="start">团队内容默认本人及管理员可管理。普通成员逐条只读共享，撤回只影响该条内容。</text>
<rect x="1482" y="50" width="54" height="36" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<circle cx="1497" cy="66" r="3" fill="#D7FF00"/><circle cx="1521" cy="66" r="3" fill="#D7FF00"/>
<path d="M1509 48 L1509 39" fill="none" stroke="#777" stroke-width="2"/>
<text x="52" y="878" font-size="17" font-weight="400" fill="#777777" text-anchor="start">按最终确认规则整理 · 2026.10.10</text>
<text x="1548" y="878" font-size="17" font-weight="400" fill="#777777" text-anchor="end">02 / 03</text>
<rect x="52" y="206" width="472" height="360" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<rect x="76" y="229" width="6" height="30" rx="2" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="96" y="254" font-size="30" font-weight="600" fill="#111111" text-anchor="start">会议共享</text>
<text x="76" y="304" font-size="24" font-weight="400" fill="#111111" text-anchor="start">会议详情 → 选普通接收成员</text>
<text x="76" y="352" font-size="24" font-weight="400" fill="#111111" text-anchor="start">每条会议独立，只读授权</text>
<text x="76" y="400" font-size="24" font-weight="400" fill="#111111" text-anchor="start">撤回 → 该条立即不可访问</text>
<text x="76" y="448" font-size="24" font-weight="400" fill="#111111" text-anchor="start">新会议不继承旧记录的授权</text>
<text x="76" y="496" font-size="24" font-weight="400" fill="#111111" text-anchor="start">只读不含编辑、删除、转授权</text>
<rect x="564" y="206" width="472" height="360" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<rect x="588" y="229" width="6" height="30" rx="2" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="608" y="254" font-size="30" font-weight="600" fill="#111111" text-anchor="start">通讯录共享</text>
<text x="588" y="304" font-size="24" font-weight="400" fill="#111111" text-anchor="start">联系人详情 → 逐条共享</text>
<text x="588" y="352" font-size="24" font-weight="400" fill="#111111" text-anchor="start">普通成员只能查看所选联系人</text>
<text x="588" y="400" font-size="24" font-weight="400" fill="#111111" text-anchor="start">撤回 → 该联系人立即不可见</text>
<text x="588" y="448" font-size="24" font-weight="400" fill="#111111" text-anchor="start">本人及管理员可编辑和管理</text>
<text x="588" y="496" font-size="24" font-weight="400" fill="#111111" text-anchor="start">列表保留“所属成员”标签</text>
<rect x="1076" y="206" width="472" height="360" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<rect x="1100" y="229" width="6" height="30" rx="2" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="1120" y="254" font-size="30" font-weight="600" fill="#111111" text-anchor="start">闪念及衍生资产</text>
<text x="1100" y="304" font-size="24" font-weight="400" fill="#111111" text-anchor="start">留在录制 / 创建所属工作区</text>
<text x="1100" y="352" font-size="24" font-weight="400" fill="#111111" text-anchor="start">本人及管理员可管理</text>
<text x="1100" y="400" font-size="24" font-weight="400" fill="#111111" text-anchor="start">日程 · 待办 · 灵感 · 记账</text>
<text x="1100" y="448" font-size="24" font-weight="400" fill="#111111" text-anchor="start">个人区、团队区均提供入口</text>
<text x="1100" y="496" font-size="24" font-weight="400" fill="#111111" text-anchor="start">团队简报只引用获授权会议</text>
<rect x="52" y="592" width="1496" height="132" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="78" y="633" font-size="27" font-weight="600" fill="#111111" text-anchor="start">通讯录归一边界</text>
<text x="330" y="633" font-size="25" font-weight="400" fill="#111111" text-anchor="start">同成员 + 同工作区：跨渠道归一，已匹配 CRM 数据优先</text>
<text x="330" y="686" font-size="25" font-weight="400" fill="#111111" text-anchor="start">来源：手动创建（含 Agent）、CRM 系统导入、手机通讯录导入；不跨成员合并</text>
<rect x="52" y="748" width="1496" height="87" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="78" y="784" font-size="27" font-weight="600" fill="#111111" text-anchor="start">管理员默认管理 Team 全部内容</text>
<text x="650" y="784" font-size="24" font-weight="400" fill="#111111" text-anchor="start">可查看、编辑、删除和管理；个人区独立。</text>
<text x="78" y="816" font-size="21" font-weight="400" fill="#666666" text-anchor="start">会议新成员不自动获权；通讯录共享也不自动授予其来源会议的访问权。</text>
</g></svg></section><section id="p3"><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>最后看状态：移除、到期、任务完成时怎么处理？</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#777"/></marker></defs><rect width="1600" height="900" fill="#FAFAFA"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif">
<rect x="52" y="42" width="65" height="34" rx="8" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="84" y="67" font-size="22" font-weight="600" fill="#111111" text-anchor="middle">03</text>
<text x="134" y="68" font-size="21" font-weight="500" fill="#666666" text-anchor="start">EurekaMind · 核心业务规则</text>
<text x="52" y="132" font-size="46" font-weight="650" fill="#111111" text-anchor="start">最后看状态：移除、到期、任务完成时怎么处理？</text>
<text x="52" y="171" font-size="23" font-weight="400" fill="#666666" text-anchor="start">用内容 / 任务所属区的权益。个人与 Team 独立；Team 由管理员付费，不跨区借用或回退扣费。</text>
<rect x="1482" y="50" width="54" height="36" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<circle cx="1497" cy="66" r="3" fill="#D7FF00"/><circle cx="1521" cy="66" r="3" fill="#D7FF00"/>
<path d="M1509 48 L1509 39" fill="none" stroke="#777" stroke-width="2"/>
<text x="52" y="878" font-size="17" font-weight="400" fill="#777777" text-anchor="start">按最终确认规则整理 · 2026.10.10</text>
<text x="1548" y="878" font-size="17" font-weight="400" fill="#777777" text-anchor="end">03 / 03</text>
<rect x="52" y="206" width="728" height="360" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<rect x="76" y="229" width="6" height="30" rx="2" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="96" y="254" font-size="30" font-weight="600" fill="#111111" text-anchor="start">被管理员移除</text>
<text x="76" y="304" font-size="25" font-weight="400" fill="#111111" text-anchor="start">撤销团队访问，拒绝原绑定的新同步</text>
<text x="76" y="352" font-size="25" font-weight="400" fill="#111111" text-anchor="start">全部团队资料 → 移交执行移除的管理员</text>
<text x="76" y="400" font-size="25" font-weight="400" fill="#111111" text-anchor="start">当前团队设备 → 系统自动解绑并清空</text>
<text x="76" y="448" font-size="25" font-weight="400" fill="#111111" text-anchor="start">原型为模拟，真实清空须设备确认</text>
<text x="76" y="496" font-size="25" font-weight="400" fill="#111111" text-anchor="start">个人区资料与设备不受影响</text>
<rect x="820" y="206" width="728" height="360" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<rect x="844" y="229" width="6" height="30" rx="2" fill="#D7FF00" stroke="#D7FF00" stroke-width="2"/>
<text x="864" y="254" font-size="30" font-weight="600" fill="#111111" text-anchor="start">团队订阅到期 / 取消生效</text>
<text x="844" y="304" font-size="25" font-weight="400" fill="#111111" text-anchor="start">该区转只读，历史内容按原权限查看</text>
<text x="844" y="352" font-size="25" font-weight="400" fill="#111111" text-anchor="start">禁止手动创建、编辑、上传、转录与 AI</text>
<text x="844" y="400" font-size="25" font-weight="400" fill="#111111" text-anchor="start">绑定设备仍同步原始音频，处理暂停</text>
<text x="844" y="448" font-size="25" font-weight="400" fill="#111111" text-anchor="start">设备绑定不变，恢复后再处理</text>
<text x="844" y="496" font-size="25" font-weight="400" fill="#111111" text-anchor="start">仅关闭自动续费，当期权益仍有效</text>
<rect x="52" y="592" width="1496" height="156" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="78" y="633" font-size="28" font-weight="600" fill="#111111" text-anchor="start">异步任务</text>
<rect x="280" y="608" width="340" height="55" rx="10" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="450" y="644" font-size="24" font-weight="500" fill="#111111" text-anchor="middle">发起时锁定工作区</text>
<rect x="707" y="608" width="340" height="55" rx="10" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="877" y="644" font-size="24" font-weight="500" fill="#111111" text-anchor="middle">执行 / 保存重检权限</text>
<rect x="1158" y="608" width="360" height="55" rx="10" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="1338" y="644" font-size="24" font-weight="500" fill="#111111" text-anchor="middle">结果写回原区</text>
<path d="M630 637 L694 637" fill="none" stroke="#777" stroke-width="2"/>
<polygon points="694,637 682.0,643.0 682.0,631.0" fill="#777"/>
<path d="M1057 637 L1145 637" fill="none" stroke="#777" stroke-width="2"/>
<polygon points="1145,637 1133.0,643.0 1133.0,631.0" fill="#777"/>
<text x="280" y="713" font-size="23" font-weight="400" fill="#111111" text-anchor="start">重试不重复建内容、不重复扣额度、不重复开通订阅。切换视图不改变任务归属。</text>
<rect x="52" y="772" width="1496" height="63" rx="18" fill="#FFFFFF" stroke="#EAEAEA" stroke-width="2"/>
<text x="78" y="812" font-size="25" font-weight="500" fill="#111111" text-anchor="start">要把硬件新录音转到个人区处理，必须本人换绑设备；只切换 App 工作区不够。</text>
</g></svg></section></main></html>
