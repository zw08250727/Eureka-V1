<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>先定归属：内容存在哪个工作区？</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#777"/></marker></defs><rect width="1600" height="900" fill="#FAFAFA"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif">
