<text x="1100" y="361" font-size="29" font-weight="600" fill="#111111" text-anchor="middle">最多一个 Team</text>
<text x="800" y="416" font-size="21" font-weight="400" fill="#666666" text-anchor="middle">以下三条归属规则适用于每一个工作区</text>
