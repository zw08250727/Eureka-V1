<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接器 · EurekaMind</title><style>/* ===== 连接器 PC 端统一版（与 App 端功能/数据/交互一致） ===== */
.conn-banner{display:flex;align-items:center;gap:8px;margin:0 0 18px;padding:12px 18px;border-radius:14px;
  background:linear-gradient(90deg,#EEF4FF,#F8FAFF);border:1px solid #E3EDFF;font-size:14px;color:#1F2329;}
.conn-banner-ico{font-size:15px;}
.conn-banner-tag{margin-left:auto;font-size:11px;color:#2E6BFF;background:#fff;border:1px solid #D8E5FF;
  border-radius:20px;padding:2px 10px;font-weight:500;}
.conn-group-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 0;min-height:24px;}
.conn-group-head-2{margin-top:30px;}
.conn-group-title{font-size:15px;font-weight:600;color:#262626;}
.conn-group-sub{font-size:12px;color:#8C8C8C;font-weight:400;}
.conn-group-hint{font-size:12px;color:#8C8C8C;}
.conn-group-hint.link{color:#2E6BFF;cursor:pointer;}
.conn-group-hint.link:hover{text-decoration:underline;}
.conn-card{display:flex;flex-direction:column;min-height:168px;border-radius:16px;border:1px solid #F0F0F0;
  background:#fff;padding:16px;cursor:pointer;transition:background .15s,border-color .15s;position:relative;min-width:0;}
.conn-card:hover{border-color:#E6E6E6;background:#F5F5F5;}
.conn-addcard{border-style:dashed;border-color:rgba(0,0,0,.15);}
.conn-addcard:hover{border-color:#B9C6DC;background:#FAFBFF;}
.conn-logo{width:48px;height:48px;border-radius:50%;background:#F5F6F8;display:flex;align-items:center;
  justify-content:center;overflow:hidden;flex-shrink:0;}
.conn-logo svg{width:26px;height:26px;display:block;}
.conn-avatar{width:48px;height:48px;border-radius:50%;background:#F3EFFE;color:#8B5CF6;font-size:19px;
  font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.conn-name{font-size:16px;font-weight:500;line-height:26px;color:#262626;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conn-chip{display:inline-flex;height:20px;align-items:center;border-radius:3px;background:#F2F3F5;padding:0 6px;
  font-size:10px;line-height:20px;color:#262626;}
.conn-desc{margin:12px 0 0;font-size:12px;line-height:18px;color:#8C8C8C;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;word-break:break-all;}
.conn-status{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;}
.conn-tools{font-size:11px;line-height:16px;color:#262626;}
.conn-tools .off{color:#8C8C8C;}
.conn-pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:14px;
  font-size:12px;font-weight:600;cursor:pointer;border:none;background:#EAF7EF;color:#1E9E62;transition:.15s;}
.conn-pill .dot{width:6px;height:6px;border-radius:50%;background:#22A06B;}
.conn-pill:hover{background:#FDECEC;color:#E05B5B;}
.conn-pill:hover .dot{background:#E05B5B;}
.conn-btn{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 16px;
  border-radius:14px;background:#2E6BFF;color:#fff;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;}
.conn-btn:hover{background:#245BE5;}
.conn-acts{display:flex;gap:6px;opacity:0;transition:opacity .15s;}
.conn-card:hover .conn-acts{opacity:1;}
.conn-ico-btn{width:28px;height:28px;border-radius:8px;border:1px solid #EEF0F3;background:#fff;display:flex;
  align-items:center;justify-content:center;cursor:pointer;color:#5A6270;padding:0;}
.conn-ico-btn:hover{background:#F5F6F8;}
.conn-ico-btn.del:hover{color:#E05B5B;border-color:#F3C9C9;background:#FFF7F7;}
/* 弹层 */
.conn-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:none;align-items:center;justify-content:center;}
.conn-mask.show{display:flex;}
.conn-dialog{width:460px;max-width:calc(100vw - 48px);max-height:calc(100vh - 80px);overflow:auto;background:#fff;
  border-radius:16px;padding:24px;box-shadow:0 18px 50px rgba(0,0,0,.18);}
.conn-dialog h3{margin:0;font-size:16px;font-weight:600;color:#262626;}
.conn-dialog .dsub{margin-top:6px;font-size:12px;color:#8C8C8C;line-height:1.7;}
.conn-tabs{display:flex;margin-top:16px;background:#F2F3F5;border-radius:10px;padding:3px;}
.conn-tab{flex:1;height:32px;border:none;background:transparent;border-radius:8px;font-size:13px;color:#5A6270;cursor:pointer;}
.conn-tab.on{background:#fff;color:#262626;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.conn-field{margin-top:14px;}
.conn-field label{display:block;font-size:12px;color:#5A6270;margin-bottom:6px;}
.conn-field .req{color:#E05B5B;margin-left:2px;}
.conn-input{width:100%;box-sizing:border-box;height:38px;border:1px solid #E5E7EB;border-radius:10px;padding:0 12px;
  font-size:13px;color:#262626;outline:none;background:#fff;}
.conn-input:focus{border-color:#2E6BFF;}
textarea.conn-input{height:auto;min-height:112px;padding:10px 12px;font-family:Menlo,Consolas,monospace;font-size:12px;resize:none;line-height:1.6;}
.conn-err{display:none;margin-top:6px;font-size:12px;color:#E05B5B;}
.conn-err.show{display:block;}
.conn-foot{display:flex;gap:12px;margin-top:22px;}
.conn-foot button{flex:1;height:40px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid #E5E7EB;background:#fff;color:#3A4149;}
.conn-foot button:hover{background:#F7F8FA;}
.conn-foot .primary{background:#2E6BFF;border-color:#2E6BFF;color:#fff;}
.conn-foot .primary:hover{background:#245BE5;}
.conn-foot .danger{background:#E05B5B;border-color:#E05B5B;color:#fff;}
.conn-foot .danger:hover{background:#D04A4A;}
/* 平台授权模拟（浏览器窗口） */
.conn-browser{width:560px;max-width:calc(100vw - 48px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.2);}
.conn-browser-bar{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;background:#F2F3F5;border-bottom:1px solid #E7E9EE;}
.conn-browser-bar .dots{display:flex;gap:6px;}
.conn-browser-bar .dots i{width:10px;height:10px;border-radius:50%;background:#D9DDE3;display:block;}
.conn-browser-bar .url{flex:1;height:24px;line-height:24px;background:#fff;border-radius:6px;font-size:11px;color:#8C8C8C;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conn-browser-body{padding:34px 32px;min-height:236px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.auth-ava{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;}
.auth-title{font-size:17px;font-weight:600;color:#262626;}
.auth-name{margin-top:10px;font-size:16px;font-weight:600;color:#262626;}
.auth-appname{margin-top:14px;width:100%;max-width:320px;height:40px;line-height:40px;border:1px solid #E5E7EB;border-radius:10px;font-size:13px;color:#262626;background:#FAFBFC;}
.auth-desc{margin-top:8px;font-size:12.5px;color:#8C8C8C;line-height:1.7;}
.auth-big{margin-top:18px;height:38px;padding:0 34px;border-radius:19px;font-size:13px;}
.auth-note{margin-top:14px;font-size:11px;color:#B3B9C2;max-width:340px;line-height:1.7;}
.auth-ok{width:52px;height:52px;border-radius:50%;background:#EAF7EF;display:flex;align-items:center;justify-content:center;}
.auth-ok svg{width:26px;height:26px;}
.conn-toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);background:#1F2329;color:#fff;font-size:13px;
  padding:9px 18px;border-radius:20px;z-index:4000;opacity:0;pointer-events:none;transition:opacity .25s;}
.conn-toast.show{opacity:1;}
/* 系统连接器介绍弹窗（参考截图 1:1 还原，左侧品牌替换为百融智能） */
.intro-card{position:relative;width:620px;max-width:calc(100vw - 48px);max-height:calc(100vh - 64px);overflow-y:auto;background:#fff;border-radius:18px;padding:34px 34px 26px;box-shadow:0 18px 50px rgba(0,0,0,.2);text-align:center;}
.intro-x{position:absolute;top:18px;right:18px;width:30px;height:30px;border:none;background:transparent;cursor:pointer;color:#5A6270;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.intro-x:hover{background:#F2F3F5;}
.intro-logos{display:flex;align-items:center;justify-content:center;gap:22px;}
.intro-logo{width:76px;height:76px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.08);}
.intro-logo svg{display:block;width:100%;height:100%;}
.intro-logo.brand{background:#fff;border:1px solid #EEF0F4;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(46,79,216,.14);}
.intro-dots{display:flex;gap:6px;margin-top:6px;}
.intro-dots i{width:6px;height:6px;border-radius:50%;background:#D3D8E0;display:block;}
.intro-title{margin-top:20px;font-size:26px;font-weight:700;color:#1F2329;}
.intro-desc{margin-top:14px;font-size:14px;color:#3A4149;line-height:1.85;}
.intro-btnrow{margin-top:18px;text-align:center;}
.intro-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 30px;border:none;border-radius:21px;background:#33567D;color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.intro-btn:hover{background:#2B4A6E;}
.intro-btn.linked{background:#fff;border:1px solid #E05B5B;color:#E05B5B;}
.intro-btn.linked:hover{background:#FDF1F1;}
.intro-status{margin-top:10px;font-size:12px;color:#8C8C8C;min-height:14px;}
.intro-tip{margin-top:24px;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#1F2329;text-align:left;}
.intro-egs{margin-top:14px;display:flex;flex-direction:column;gap:12px;}
.intro-eg{display:flex;align-items:center;gap:14px;background:#E8EDF5;border-radius:12px;padding:16px 18px;text-align:left;}
.intro-eg p{margin:0;flex:1;font-size:14.5px;line-height:1.75;color:#1F2329;}
.intro-eg svg{flex:none;color:#3A4149;}

function renderSys(){

    var c = CONNS[k];
    var action = c.connected
      ? '<button class="conn-pill" title="查看连接器" onclick="event.stopPropagation();openIntro(\''+k+'\')"><span class="dot"></span>已连接</button>'
      : '<button class="conn-btn" onclick="event.stopPropagation();openIntro(\''+k+'\')">连接</button>';

      ? '已连接'+(c.tools?' · '+c.tools+' tools':'')

      + '<div style="display:flex;align-items:flex-start;gap:12px;">'

/* ---------- 通用 ---------- */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('connToast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}
function maskShow(id){ var el=document.getElementById(id);el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.classList.add('show');var focus=el.querySelector('input,button,textarea');if(focus)focus.focus(); }
function closeMask(id){
  document.getElementById(id).classList.remove('show');
  if(id==='maskAuth' && authTimer){ clearTimeout(authTimer); authTimer=null; }
}
var pendingOk=null;
function confirmDialog(o){
  pendingOk=o.onOk;
  document.getElementById('dlgTitle').textContent=o.title;
  document.getElementById('dlgDesc').textContent=o.desc;
  var ok=document.getElementById('dlgOk');
  ok.textContent=o.okText||'确定';
  ok.className=o.danger?'danger':'primary';
  maskShow('maskDlg');
}
function dlgOkClick(){ closeMask('maskDlg'); if(pendingOk){ var f=pendingOk; pendingOk=null; f(); } }

/* ---------- 系统连接器：断开（与 App 一致：点击已连接 → 二次确认） ---------- */
function askDisconnect(key){if(!connectorWritable())return;
  var c=CONNS[key];
  confirmDialog({ title:'断开连接', danger:true, okText:'断开',
    desc:'确定断开'+c.name+'？断开后相关工具将无法使用，助手中已开启的该连接器工具将自动取消。',
    onOk:function(){ if(!connectorWritable())return; c.connected=false; renderSys(); toast('已断开'+c.name); } });
}

function openIntro(key){
  introKey=key;

  document.getElementById('introBrand').className='intro-logo brand';
  document.getElementById('introBrand').innerHTML=BRLOGO;
  document.getElementById('introPlat').innerHTML=BRAND[key];
  document.getElementById('introTitle').textContent='连接 '+c.name;
  document.getElementById('introDesc').textContent=it.desc;
  document.getElementById('introEgs').innerHTML=it.egs.map(function(t){
    return '<div class="intro-eg"><p>'+t+'</p>'+CHATICO+'</div>';
  }).join('');
  var b=document.getElementById('introBtn');
  if(c.connected){
    b.className='intro-btn linked';
    b.innerHTML=LINKICO+'解连';
    b.onclick=function(){ introDisconnect(); };
    document.getElementById('introStatus').textContent='当前已连接'+(c.tools?' · '+c.tools+' tools':'');
  } else {
    b.className='intro-btn';
    b.innerHTML=LINKICO+'连接';
    b.onclick=function(){ introConnect(); };
    document.getElementById('introStatus').textContent='';
  }
  maskShow('maskIntro');
}

/* ---------- 自定义连接器：添加 / 编辑 / 删除（与 App 同字段、同校验、同查重） ---------- */
var addMode='url', editIdx=-1;
function openAdd(mode, idx){
 if(new URLSearchParams(location.search).get('readonly')==='true'){toast('当前工作区为只读');return;}
  editIdx = (typeof idx==='number' && idx>=0) ? idx : -1;
  document.getElementById('dlgAddTitle').textContent = editIdx>=0 ? '编辑自定义连接器' : '添加自定义连接器';
  var m = editIdx>=0 ? CUSTOM[editIdx] : null;
  document.getElementById('fName').value  = m?m.name:'';
  document.getElementById('fUrl').value   = (m&&m.url)?m.url:'';
  document.getElementById('fName2').value = m?m.name:'';
  document.getElementById('fJson').value = m&&m.config?m.config:'';
  switchAddMode('url'); clearErrs();
  maskShow('maskAdd');
}
function switchAddMode(mo){
  addMode=mo;
  document.getElementById('tabUrl').classList.toggle('on', mo==='url');
  document.getElementById('tabJson').classList.toggle('on', mo==='json');
  document.getElementById('formUrl').style.display  = mo==='url'  ? '' : 'none';
  document.getElementById('formJson').style.display = mo==='json' ? '' : 'none';
}
function clearErrs(){ ['eName','eUrl','eName2','eJson'].forEach(function(id){ document.getElementById(id).classList.remove('show'); }); }
function showErr(id){document.getElementById(id).classList.add('show')}
function dup(name){
  var hit = CUSTOM.some(function(m,i){ return m.name===name && i!==editIdx; });
  if(hit) toast('名称已存在，请修改');
  return hit;
}
function submitAdd(){if(!connectorWritable())return;
  clearErrs();
  var name = document.getElementById('fName').value.trim();
  var name2 = document.getElementById('fName2').value.trim();
  var usedName = addMode==='url' ? name : name2;
  var ok=true;
  if(!usedName){ showErr(addMode==='url'?'eName':'eName2'); ok=false; }
  if(!ok) return;
  if(dup(usedName)) return;
  if(addMode==='url'){
    var url=document.getElementById('fUrl').value.trim();
    if(!/^https?:\/\/.+/.test(url)){ showErr('eUrl'); return; }
    if(editIdx>=0){ CUSTOM[editIdx].name=usedName; CUSTOM[editIdx].url=url; toast('保存成功'); }
    else { CUSTOM.push({ name:usedName, url:url, num:3 }); toast('添加成功'); }
  } else {
    var raw=document.getElementById('fJson').value.trim(), parsed=null, first=null;
    try{
      var j=JSON.parse(raw);
      var servers=j.mcpServers||j;
      var k0=Object.keys(servers)[0];
      first=servers[k0];
      if(first && (first.url||first.command)) parsed=first; else parsed=null;
    }catch(e){ parsed=null; }
    if(!parsed){ showErr('eJson'); return; }
    if(editIdx>=0){ CUSTOM[editIdx].name=usedName; CUSTOM[editIdx].url=parsed.url||'';CUSTOM[editIdx].config=raw; toast('保存成功'); }
    else { CUSTOM.push({ name:usedName, url:(parsed.url||''),config:raw, num:3 }); toast('添加成功'); }
  }
  closeMask('maskAdd'); renderCustom();localStorage.setItem(storageKey,JSON.stringify({system:CONNS,custom:CUSTOM}));
}
function askDelete(idx){if(!connectorWritable())return;
  var m=CUSTOM[idx];
  confirmDialog({ title:'删除自定义连接器', danger:true, okText:'删除',
    desc:'确定删除「'+esc(m.name)+'」？删除后该连接器及其 '+m.num+' 个工具将无法使用。',
    onOk:function(){ if(!connectorWritable())return; CUSTOM.splice(idx,1); renderCustom();localStorage.setItem(storageKey,JSON.stringify({system:CONNS,custom:CUSTOM})); toast('已删除「'+esc(m.name)+'」'); } });
}

/* ---------- 搜索（按名称过滤两个分组） ---------- */
document.getElementById('connSearch').addEventListener('input', function(e){
  var q=e.target.value.trim().toLowerCase();
  ['sysGrid','customGrid'].forEach(function(id){
    var g=document.getElementById(id), any=false;
    g.querySelectorAll('.conn-card').forEach(function(c){
      var hit=!q || (c.getAttribute('data-name')||'').toLowerCase().indexOf(q)>-1;
      c.style.display = hit ? '' : 'none';
      if(hit) any=true;
    });
    var head=g.previousElementSibling;
    if(head && head.classList.contains('conn-group-head')) head.style.display = any ? '' : 'none';
  });
});

var scope=new URLSearchParams(location.search);var storageKey='eureka:connectors:'+scope.get('space')+':'+scope.get('actor');
try{var saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved){CONNS=saved.system;CUSTOM=saved.custom;}}catch(e){}
function connectorWritable(){
 if(scope.get('readonly')==='true'){originalToast('当前工作区为只读');return false;}
 try{var state=JSON.parse(localStorage.getItem('eureka:workspaces:v2')||'null');if(state){var w=state.spaces.find(function(w){return w.id===scope.get('space')});if(!w||(w.type==='team'&&(w.status!=='active'||!w.members.some(function(m){return m.id===scope.get('actor')&&m.status==='active'})))){originalToast('工作区权限已变化，请刷新');return false;}}}catch(e){originalToast('无法读取工作区权限');return false;}return true;
}
var originalToast=toast;toast=function(message){localStorage.setItem(storageKey,JSON.stringify({system:CONNS,custom:CUSTOM}));originalToast(message)};
renderSys(); renderCustom();
